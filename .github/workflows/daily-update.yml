name: Daily learning update
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:
permissions:
  contents: write
  actions: write           # to trigger the deploy workflow (commits by GITHUB_TOKEN do not trigger it)
concurrency:
  group: daily-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Ask Claude for today's updates (allowlisted web search only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run update
      - name: Validate before publishing
        run: npm run validate && npm test
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data/news.json; then echo "No changes"; exit 0; fi
          git config user.name "learncsinsimple-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/news.json
          git commit -m "chore(news): daily update $(date -u +%F)"
          git push
          gh workflow run deploy.yml --ref main
