name: Daily news and forecast
on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST, before the Indian market day starts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-outlook
jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: News headlines + release calendar (free feeds, no AI by default) and 3-day forecast ranges
        env:
          # NEWS_MODE is empty by default = free feeds. Set the repository variable NEWS_MODE=claude to use Claude (needs API credits).
          NEWS_MODE: ${{ vars.NEWS_MODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update-outlook.mjs
