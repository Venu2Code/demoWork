name: Live prices
# Records a price row only when the rate changes. GitHub may delay scheduled runs by a few minutes.
# Gold only. Sized for GoldAPI's 300 requests/month: 8 runs/day x 1 request x 26 days = 208.
# Times (UTC) = 09:30, 11:00, 12:30, 14:00, 15:30, 17:00, 18:30, 20:00 IST, Monday-Saturday.
# Keep in sync with site/data/schedule.json (a test fails if they drift).
on:
  schedule:
    - cron: "0 4,7,10,13 * * 1-6"
    - cron: "30 5,8,11,14 * * 1-6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # --omit=dev: this job holds secret keys, so it installs only the runtime packages (no test tooling).
      - run: npm ci --omit=dev
      - name: Fetch, validate and store prices
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          GOLDAPI_MONTHLY_LIMIT: ${{ vars.GOLDAPI_MONTHLY_LIMIT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-live.mjs
